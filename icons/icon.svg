<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="leather" cx="40%" cy="30%" r="85%">
      <stop offset="0" stop-color="#9a6844"/>
      <stop offset="0.6" stop-color="#734a30"/>
      <stop offset="1" stop-color="#4f3221"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecd29a"/>
      <stop offset="0.5" stop-color="#c9a259"/>
      <stop offset="1" stop-color="#e3c27e"/>
    </linearGradient>
  </defs>
  <!-- leather cover -->
  <rect width="512" height="512" fill="url(#leather)"/>
  <!-- book spine shadow -->
  <rect x="0" y="0" width="70" height="512" fill="#000" opacity="0.16"/>
  <rect x="70" y="0" width="4" height="512" fill="#000" opacity="0.12"/>
  <!-- gold frame -->
  <rect x="110" y="72" width="330" height="368" rx="14" fill="none" stroke="url(#gold)" stroke-width="5"/>
  <rect x="124" y="86" width="302" height="340" rx="8" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>
  <!-- heart -->
  <path d="M275 316c-48-34-80-62-80-98 0-24 18-42 41-42 17 0 30 9 39 23 9-14 22-23 39-23 23 0 41 18 41 42 0 36-32 64-80 98z" fill="none" stroke="url(#gold)" stroke-width="9" stroke-linejoin="round"/>
  <!-- little flourishes -->
  <path d="M215 360h120" stroke="#d6b46e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="275" cy="360" r="6" fill="url(#gold)"/>
  <path d="M215 140h120" stroke="#d6b46e" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <!-- ribbon bookmark -->
  <path d="M372 0h30v110l-15-14-15 14z" fill="#b5503a"/>
  <path d="M372 0h6v102l-6 8z" fill="#000" opacity="0.15"/>
</svg>
