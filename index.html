<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little Memories</title>
  <meta name="description" content="A private diary that lives only on your phone.">

  <!-- Behave like a real app when added to the iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memories">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f3ead9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#211812" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/cormorant-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-locked">

  <!-- The screens are drawn in here by js/app.js -->
  <div id="app"></div>

  <!-- Lock screen (covers everything while locked) -->
  <section id="lock" class="lock show" aria-label="Locked">
    <div class="lock-inner">
      <div class="lock-ornament" aria-hidden="true">❦</div>
      <h1 id="lock-title" class="lock-title">Welcome back</h1>
      <p id="lock-hint" class="lock-hint">&nbsp;</p>
      <div id="pin-dots" class="pin-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="keypad" id="keypad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <button id="btn-faceid" class="key-plain" aria-label="Unlock with Face ID" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V5.5A1.5 1.5 0 015.5 4H8M16 4h2.5A1.5 1.5 0 0120 5.5V8M20 16v2.5a1.5 1.5 0 01-1.5 1.5H16M8 20H5.5A1.5 1.5 0 014 18.5V16"/><path d="M9 9.5v1M15 9.5v1M12 9.5v3.5h-1M9.5 15.5c1.4 1.2 3.6 1.2 5 0"/></svg>
        </button>
        <button data-key="0">0</button>
        <button data-key="back" class="key-plain" aria-label="Delete">⌫</button>
      </div>
      <button id="btn-lock-cancel" class="text-btn lock-cancel" hidden>Cancel</button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
