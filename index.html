<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Little Memories</title>
  <meta name="description" content="A private journal that lives only on your phone.">

  <!-- Behave like a real app when added to the iPhone Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Memories">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f7f2e9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1511" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex, nofollow">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/hanken-grotesk-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-locked">

  <!-- Only on wide screens (computer): sidebar and note list, drawn by js/views.js -->
  <aside id="sidebar" class="sidebar" aria-label="Journal"></aside>
  <section id="listpane" class="listpane" aria-label="Notes"></section>

  <!-- The screens are drawn in here by js/app.js -->
  <div id="app"></div>

  <!-- Bottom navigation: four places, and "new note" always in the middle -->
  <nav class="tabbar" id="tabbar" aria-label="Main">
    <button class="tab" data-tab=""><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5h11.5a2.5 2.5 0 012.5 2.5v12.5H7.5A2.5 2.5 0 015 17V4.5z"/><path d="M5 17a2.5 2.5 0 012.5-2.5H19"/></svg></span>Home</button>
    <button class="tab" data-tab="notes"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5h16M4 10.5h16M4 15.5h10"/></svg></span>Notes</button>
    <button class="tab-compose" data-compose aria-label="New note"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4.5H6A1.5 1.5 0 004.5 6v12A1.5 1.5 0 006 19.5h12a1.5 1.5 0 001.5-1.5v-6"/><path d="M17.5 4l2.5 2.5-7.5 7.5-3.2.7.7-3.2z"/></svg></span></button>
    <button class="tab" data-tab="memories"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5h10v15l-5-3.5-5 3.5z"/></svg></span>Memories</button>
    <button class="tab" data-tab="search"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/></svg></span>Search</button>
  </nav>
  <input id="keyboard-holder" class="keyboard-holder" type="text" aria-hidden="true" tabindex="-1">

  <!-- Lock screen (covers everything while locked) -->
  <section id="lock" class="lock show" aria-label="Locked">
    <div class="lock-inner">
      <div id="lock-book" class="eyebrow lock-book">Little Memories</div>
      <h1 id="lock-title" class="lock-title">Welcome back</h1>
      <p id="lock-hint" class="lock-hint">&nbsp;</p>
      <div id="pin-dots" class="pin-dots" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
      <div class="keypad" id="keypad">
        <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
        <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
        <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
        <span class="key-space"></span>
        <button data-key="0">0</button>
        <button data-key="back" class="key-plain" aria-label="Delete">Delete</button>
      </div>
      <div class="lock-alt">
        <button id="btn-faceid" hidden>Use Face ID</button>
        <button id="btn-lock-cancel" hidden>Cancel</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
